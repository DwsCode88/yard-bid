<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bid received — thanks!</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f5f3ee;color:#1d2321;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:18px}
  .card{background:#fff;border:1px solid #ddd8cc;border-radius:14px;padding:28px;max-width:440px;text-align:center}
  h1{color:#2f6b3c;margin:0 0 8px}
  a.btn{display:block;margin-top:14px;padding:14px;border-radius:10px;background:#1877f2;color:#fff;font-weight:700;text-decoration:none}
  a.back{display:block;margin-top:12px;color:#5d6662}
</style>
</head>
<body>
<div class="card">
  <h1>Bid received ✅</h1>
  <p>Thanks! Your bid was sent to the homeowner.</p>
  <p><strong>Next step: send me a message</strong> so we can go over details and timing.</p>
  <a class="btn" id="msg" href="#">Message me on Facebook</a>
  <a class="back" href="index.html">Back to job details</a>
</div>
<script>
  const MESSENGER_URL = ""; // e.g. "https://m.me/yourname"
  const b = document.getElementById("msg");
  if (MESSENGER_URL) b.href = MESSENGER_URL; else b.textContent = "Message me on Facebook (reply to my post)";
</script>
</body>
</html>
